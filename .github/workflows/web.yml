name: Web (GitHub Pages)

# Sestaví webovou verzi hry a nasadí ji na GitHub Pages.
# V nastavení repozitáře je potřeba zapnout Pages se zdrojem "GitHub Actions".
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --ci
      - name: Export web build
        run: npx expo export --platform web --output-dir dist
      - name: Use relative asset paths (Pages serves the site from a sub-path)
        run: |
          sed -i 's|src="/_expo/|src="./_expo/|g; s|href="/favicon.ico"|href="./favicon.ico"|g' dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable GitHub Pages (if not already enabled)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "GitHub Pages status check returned: $STATUS"
          if [ "$STATUS" = "404" ]; then
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"build_type":"workflow"}')
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            echo "Enable Pages response ($HTTP_CODE): $BODY"
            if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "409" ]; then
              echo "::warning::Failed to enable GitHub Pages (HTTP $HTTP_CODE). Ensure Pages is enabled in repository settings."
            fi
          elif [ "$STATUS" != "200" ] && [ "$STATUS" != "204" ]; then
            echo "::warning::Unexpected status $STATUS when checking GitHub Pages. Proceeding anyway."
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
