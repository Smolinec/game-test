name: Web (GitHub Pages)

# Sestaví webovou verzi hry a nasadí ji na GitHub Pages.
# V nastavení repozitáře (Settings → Pages → Build and deployment) musí být
# zdroj nastavený na "GitHub Actions". Při zdroji "Deploy from a branch"
# GitHub navíc spouští vlastní Jekyll build, který místo hry publikuje README.
on:
  push:
    branches: [main, master, claude/idle-game-ios-android-l78pxh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --ci
      - name: Export web build
        run: npx expo export --platform web --output-dir dist
      - name: Use relative asset paths (Pages serves the site from a sub-path)
        run: |
          sed -i 's|src="/_expo/|src="./_expo/|g; s|href="/favicon.ico"|href="./favicon.ico"|g' dist/index.html
          # Assety (zvuky) jsou v bundlu odkazované absolutně; na Pages běží web v podadresáři.
          sed -i 's|"/assets/|"./assets/|g' dist/_expo/static/js/web/*.js
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
